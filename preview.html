<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tayyor Ilova</title>
<style>
body{background:#0f172a;color:#fff;font-family:sans-serif;margin:0;padding:0}
.bar{background:#1e293b;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #2563eb}
.bar a{color:#4ade80;text-decoration:none;font-weight:bold;font-size:14px}
.empty{padding:40px 20px;text-align:center}
.empty .box{background:#1e293b;border:2px solid #334155;padding:25px;border-radius:12px;max-width:420px;margin:0 auto}
</style>
</head>
<body>
<div class="bar"><span>🚀 Sizning ilovangiz</span><a href="index.html">← Bosh sahifa</a></div>
<div id="content"></div>
<script>
const app = localStorage.getItem('zavod_generated_app');
const contentDiv = document.getElementById('content');
if(app){
 const iframe = document.createElement('iframe');
 iframe.style.width='100%';
 iframe.style.height='calc(100vh - 46px)';
 iframe.style.border='none';
 iframe.style.background='#fff';
 iframe.srcdoc = app;
 contentDiv.appendChild(iframe);
}else{
 contentDiv.innerHTML = '<div class="empty"><div class="box"><h2>⚠️ Hali ilova yaratilmagan</h2><p>Avval bosh sahifada goyangizni yozib, Zavodni ishga tushiring.</p><p><a href="index.html" style="color:#60a5fa">← Bosh sahifaga qaytish</a></p></div></div>';
}
</script>
</body>
</html>
