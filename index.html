<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ILOVA ZAVODI</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        .box { background: #1e293b; border: 2px solid #2563eb; padding: 20px; border-radius: 12px; max-width: 500px; margin: 0 auto; }
        textarea { width: 100%; height: 80px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .status, .res { display: none; background: #0f172a; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: left; font-size: 14px; }
        .res { border: 2px solid #22c55e; color: #38bdf8; }
    </style>
</head>
<body>
    <div class="box">
        <h2>AI ILOVA ZAVODI v0.1</h2>
        <textarea id="inp" placeholder="G'oyangizni yozing..."></textarea>
        <button onclick="start()">Zavodni ishga tushirish</button>
        <div id="st" class="status"></div>
        <div id="rs" class="res"></div>
    </div>
<script>
function start() {
    var val = document.getElementById('inp').value;
    if(!val.trim()) { alert("G'oyani yozing!"); return; }
    var st = document.getElementById('st'); var rs = document.getElementById('rs');
    st.style.display = "block"; rs.style.display = "none";
    st.innerHTML = "⏳ 1. Idea Analyzer AI ishlamoqda...";
    setTimeout(function() {
        st.innerHTML = "⚙️ 2. Architecture Planner AI loyihalamoqda...";
        setTimeout(function() {
            st.innerHTML = "🚀 3. Report Generator kod yaratmoqda...";
            setTimeout(function() {
                st.style.display = "none"; rs.style.display = "block";
                var slug = val.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                rs.innerHTML = "<b>✅ ZAVOD HISOBOTI TAYYOR!</b><br><br><b>G'oya:</b> "+val+"<br><br><b>1. Agent:</b> Tahlil tugadi.<br><b>2. Agent:</b> Arxitektura tayyor.<br><b>3. Agent:</b> Kod yuklandi.<br><br>🌐 <b>Sinash manzili:</b><br><a href='https://github.io"+slug+"-preview/' style='color:#4ade80;'>https://github.io"+slug+"-preview/</a>";
            }, 1000);
        }, 1000);
    }, 1000);
}
</script>
</body>
</html>
