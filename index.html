<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ZAVOD</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        .box { background: #1e293b; border: 2px solid #2563eb; padding: 20px; border-radius: 12px; max-width: 500px; margin: 0 auto; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .res { display: none; background: #0f172a; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: left; border: 2px solid #22c55e; }
    </style>
</head>
<body>
    <div class="box">
        <h2>AI ILOVA ZAVODI v0.1</h2>
        <textarea id="inp" placeholder="G'oyangizni yozing..."></textarea>
        <button onclick="abc()">Zavodni ishga tushirish</button>
        <div id="rs" class="res">
            <span style="color:#22c55e; font-weight:bold;">✅ ZAVOD HISOBOTI TAYYOR!</span>
            <p>1. Idea Analyzer AI g'oyani tahlil qildi.</p>
            <p>2. Architecture Planner AI tizimni loyihaladi.</p>
            <p>3. Report Generator hamma narsani tayyorladi.</p>
            <hr style="border:0; border-top:1px solid #334155; margin:10px 0;">
            <p>🌐 <b>Tayyor ilovani brauzerda sinash manzili:</b></p>
            <a href="https://github.io" style="color:#4ade80; font-weight:bold; text-decoration:underline;">https://github.io</a>
        </div>
    </div>
<script>
function abc() {
    var txt = document.getElementById('inp').value;
    if(!txt.trim()) { alert("G'oyani yozing!"); return; }
    document.getElementById('rs').style.display = "block";
}
</script>
</body>
</html>
